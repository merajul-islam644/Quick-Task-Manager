<style>
  .qs-top { background: hsl(var(--card)); border-bottom: 1px solid hsl(var(--border)); }
  .qs-top-bar { display: flex; align-items: center; gap: calc(16px * var(--space-scale, 1)); padding-top: 12px; padding-bottom: 12px; }
  .qs-top-nowrap { display: flex; align-items: center; gap: calc(12px * var(--space-scale, 1)); flex: none; }
  .qs-top-trail { display: flex; align-items: center; gap: calc(12px * var(--space-scale, 1)); }
  .qs-top .ds-brand-link { display: inline-flex; align-items: center; }
  .qs-menu-theme { padding: 8px 4px 4px; display: flex; justify-content: flex-start; }
  .qs-menu-signout { display: none; }
  @media (max-width: 760px) {
    .qs-top-bar { gap: calc(8px * var(--space-scale, 1)); }
    .qs-menu-signout { display: block; }
  }
</style>
<header class="qs-top" data-eid="e1">

      <div class="ds-menu-list" data-eid="e3">

        <a data-goto="settings" data-eid="e6">Settings</a>
        <a class="qs-menu-signout" data-goto="welcome" data-eid="e7">Sign out</a>
        <div class="qs-menu-theme" data-eid="e8">

          </div>
        </div>

      <a class="ds-brand-link ds-only-narrow" data-goto="home" data-eid="e14"><img class="ds-brand ds-brand-light" src="https://blocksdev.blob.core.windows.net/d37088d949337437ea80c61bce50dfd50/Public/4db7d9fa-5751-4d03-a387-a03389ae8786/66bc4fc6-9829-4297-b579-36b98cd4b1c2/pikachu.png" alt="Quick Task Manager" data-eid="e15"><img class="ds-brand ds-brand-dark" src="https://blocksdev.blob.core.windows.net/d37088d949337437ea80c61bce50dfd50/Public/f2f6488c-a0c3-4e6a-9786-e726fff29e15/106500fc-0028-44d1-a371-c9fae6669afd/pikachu.png" alt="Quick Task Manager" data-eid="e16"></a>

        <button class="ds-active" aria-label="Light" data-eid="e20"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
